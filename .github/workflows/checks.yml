name: Checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Require a Changeset for package changes
        if: github.event_name == 'pull_request'
        run: node tests/support/release-changeset.mjs
        env:
          CHANGESET_BASE: ${{ github.event.pull_request.base.sha }}
      - run: yarn build
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test:regressions
      - run: yarn check:packages
